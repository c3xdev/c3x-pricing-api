# Compose overlay that adds a daily scraper sidecar. Use with the root compose
# file:
#   docker compose -f docker-compose.yml -f deploy/compose/docker-compose.scraper.yml up -d
services:
  scraper:
    build: ../..
    # Simple cron loop: sleep until 03:00 UTC, run scrape, repeat. No external
    # cron daemon needed. The next-run time is plain shell arithmetic because
    # the runtime image is Alpine, whose BusyBox `date` has neither GNU
    # `-d "tomorrow 03:00"` nor BSD `-v`.
    #
    # A failed scrape is not swallowed: the loop exits with the scrape's exit
    # code, so the failure shows in `docker compose ps` (restart count) and
    # `docker compose logs scraper`, and the scrape_runs row is already marked
    # failed (surfaced by /status). The restart policy then brings the
    # container back to wait for the next 03:00 window.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while true; do
          now=$$(date -u +%s)
          wait_s=$$(( (3 * 3600 - now % 86400 + 86400) % 86400 ))
          [ "$$wait_s" -eq 0 ] && wait_s=86400
          echo "[scraper] next run in $${wait_s}s"
          sleep "$$wait_s"
          echo "[scraper] starting $$(date -u)"
          rc=0
          c3x-pricing-api scrape --vendor all || rc=$$?
          if [ "$$rc" -ne 0 ]; then
            echo "[scraper] FAILED (exit=$$rc) $$(date -u)" >&2
            exit "$$rc"
          fi
          echo "[scraper] finished $$(date -u)"
        done
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-c3x}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-c3x_pricing}?sslmode=disable"
      GCP_API_KEY: "${GCP_API_KEY:-}"
      SCRAPE_CONCURRENCY: "${SCRAPE_CONCURRENCY:-4}"
      # Soft Go heap target just under the container limit, so the GC works
      # harder before the kernel OOM-kills the scrape.
      GOMEMLIMIT: "${SCRAPER_GOMEMLIMIT:-7GiB}"
    # The EC2 price files are parsed one region at a time per worker, at
    # 0.5-1.5 GB each, so peak memory scales with SCRAPE_CONCURRENCY. Raise
    # this together with SCRAPE_CONCURRENCY.
    deploy:
      resources:
        limits:
          memory: ${SCRAPER_MEM_LIMIT:-8g}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

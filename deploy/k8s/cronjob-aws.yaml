apiVersion: batch/v1
kind: CronJob
metadata:
  name: c3x-scrape-aws
  namespace: c3x-pricing
spec:
  # Weekly on Sunday 03:00 UTC. AWS bulk price list churns slowly.
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: scrape
              image: ghcr.io/c3xdev/c3x-pricing-api:latest
              args: ["scrape", "--vendor", "aws"]
              envFrom:
                - secretRef: { name: c3x-pricing-secrets }
              env:
                - name: ENV
                  value: "production"
                - name: SCRAPE_CONCURRENCY
                  value: "8"
              resources:
                # AWS scraper holds ~410k products in batches (AmazonEC2 dominates).
                # Limit accommodates peak RSS; request is small so the scheduler
                # doesn't permanently reserve the burst capacity from the pool.
                requests: { cpu: "1", memory: 2Gi }
                limits:   { cpu: "2", memory: 14Gi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities: { drop: ["ALL"] }

apiVersion: batch/v1
kind: CronJob
metadata:
  name: c3x-scrape-azure
  namespace: c3x-pricing
spec:
  # Daily at 03:30 UTC. Azure retail prices update frequently.
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: scrape
              image: ghcr.io/c3xdev/c3x-pricing-api:IMAGE_TAG
              args: ["scrape", "--vendor", "azure"]
              envFrom:
                - secretRef: { name: c3x-pricing-secrets }
              env:
                - name: ENV
                  value: "production"
                - name: SCRAPE_CONCURRENCY
                  value: "8"
              resources:
                # Azure scraper holds ~490k products in batches (Virtual Machines dominates).
                # Limit accommodates peak RSS; request is small so the scheduler
                # doesn't permanently reserve the burst capacity from the pool.
                requests: { cpu: "1", memory: 2Gi }
                limits:   { cpu: "2", memory: 14Gi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities: { drop: ["ALL"] }

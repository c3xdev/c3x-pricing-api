apiVersion: batch/v1
kind: CronJob
metadata:
  name: c3x-scrape-gcp
  namespace: c3x-pricing
spec:
  # Daily at 04:00 UTC.
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: scrape
              image: ghcr.io/c3xdev/c3x-pricing-api:IMAGE_TAG
              args: ["scrape", "--vendor", "gcp"]
              envFrom:
                - secretRef: { name: c3x-pricing-secrets }
              env:
                - name: ENV
                  value: "production"
                - name: SCRAPE_CONCURRENCY
                  value: "8"
              resources:
                # GCP scraper handles ~72k products — an order of magnitude smaller
                # than AWS/Azure. Tighter envelope reflects that.
                requests: { cpu: 500m, memory: 1Gi }
                limits:   { cpu: "2",  memory: 4Gi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities: { drop: ["ALL"] }

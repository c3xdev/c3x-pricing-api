# Template. Copy to secret.yaml, fill in values, then `kubectl apply -f secret.yaml`.
# NEVER commit a filled copy to version control.
apiVersion: v1
kind: Secret
metadata:
  name: c3x-pricing-secrets
  namespace: c3x-pricing
type: Opaque
stringData:
  # Use sslmode=require or sslmode=verify-full in production. The API refuses
  # to start with sslmode=disable when ENV=production.
  DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/c3x_pricing?sslmode=require"
  # Optional but strongly recommended: disables GraphQL endpoint without auth.
  API_KEY: "change-me"
  # Required only for GCP scrapes.
  GCP_API_KEY: ""

name: Scheduled scrape

on:
  schedule:
    - cron: "0 3 * * 0"   # AWS: weekly, Sunday 03:00 UTC
    - cron: "15 3 * * *"  # Azure: daily 03:15 UTC
    - cron: "30 3 * * *"  # GCP: daily 03:30 UTC
  workflow_dispatch:
    inputs:
      vendor:
        description: "Vendor to scrape"
        required: true
        default: "all"
        type: choice
        options: [aws, azure, gcp, all]

permissions:
  contents: read

concurrency:
  # Serialize runs of the same vendor. The Postgres advisory lock is a safety
  # net; this keeps Actions minutes down.
  group: scrape-${{ github.event.inputs.vendor || github.event.schedule }}
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Resolve vendor
        id: vendor
        env:
          INPUT_VENDOR: ${{ github.event.inputs.vendor }}
          SCHED: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT_VENDOR" ]; then
            echo "v=$INPUT_VENDOR" >> "$GITHUB_OUTPUT"
          else
            case "$SCHED" in
              "0 3 * * 0")  echo "v=aws"   >> "$GITHUB_OUTPUT" ;;
              "15 3 * * *") echo "v=azure" >> "$GITHUB_OUTPUT" ;;
              "30 3 * * *") echo "v=gcp"   >> "$GITHUB_OUTPUT" ;;
              *)            echo "v=all"   >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Build
        run: go build -o c3x-pricing-api ./cmd/server

      - name: Scrape
        env:
          ENV: production
          DATABASE_URL: ${{ secrets.C3X_DATABASE_URL }}
          GCP_API_KEY: ${{ secrets.C3X_GCP_API_KEY }}
          SCRAPE_CONCURRENCY: "8"
        run: ./c3x-pricing-api scrape --vendor ${{ steps.vendor.outputs.v }}

kind         = "azurerm_container_app"
display_name = "Azure Container App"
provider     = "azure"

# STATIC: Container Apps isn't exposed in the upstream backend
# under any direct service name (probed 2026-06-09).
#
# Container Apps Consumption plan rates (East US):
#   - vCPU:    $0.000024/vCPU-second × 2,628,000 sec/month = ~$63.07/vCPU-month
#   - Memory:  $0.000003/GiB-second × 2,628,000 = ~$7.88/GiB-month
#   - Requests: $0.40 per 1M (first 2M free)
# Provisioned (Dedicated) plans bill flat per instance hour.

[[dimensions]]
id       = "vcpu"
label    = "vCPU"
unit     = "vCPU-seconds"
quantity = "default(cpu, 0.25) * monthly_hours() * 3600"
rate     = "0.000024"

[[dimensions]]
id       = "memory"
label    = "Memory"
unit     = "GiB-seconds"
quantity = "default(memory_gb, 0.5) * monthly_hours() * 3600"
rate     = "0.000003"

[[dimensions]]
id       = "requests"
label    = "Requests (above free 2M)"
unit     = "1M-requests"
quantity = '''
  default(monthly_requests, 0) > 2_000_000 ?
    (default(monthly_requests, 0) - 2_000_000) / 1_000_000 : 0
'''
rate     = "0.40"
when     = "default(monthly_requests, 0) > 2_000_000"

[fixture]
attributes = { cpu = 0.5, memory_gb = 1.0, monthly_requests = 0 }
# (0.5 × 0.000024 + 1 × 0.000003) × 730 × 3600 = $39.42
expected_monthly_cost = 39.42
exact = true
last_verified = "2026-06-09"

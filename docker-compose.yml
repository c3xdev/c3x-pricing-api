services:
  db:
    image: postgres:16-alpine
    # Without this, a Docker daemon restart / host reboot / package upgrade
    # leaves db stopped while api (restart: unless-stopped) crash-loops on the
    # missing hostname — a full outage. Keep db's policy in sync with api's.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-c3x}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-c3x_pricing}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-c3x} -d ${POSTGRES_DB:-c3x_pricing}"]
      interval: 2s
      timeout: 5s
      retries: 5
    # Postgres keeps its working set in shared_buffers plus the page cache;
    # the cgroup reclaims page cache before OOM-killing, so this caps the
    # database's footprint on a shared host without starving it.
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-2g}

  api:
    build: .
    command: ["serve"]
    environment:
      PORT: "4000"
      # WARNING: sslmode=disable is acceptable here because the DB is on the
      # same Docker network. In production, use sslmode=require or verify-full.
      DATABASE_URL: "postgres://${POSTGRES_USER:-c3x}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-c3x_pricing}?sslmode=disable"
      API_KEY: ${API_KEY:-}
      GCP_API_KEY: ${GCP_API_KEY:-}
      SCRAPE_CONCURRENCY: ${SCRAPE_CONCURRENCY:-4}
      # Query cost limits. The c3x CLI sends one products query per request
      # (limit:50) and never batches, so these sit well above its needs.
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-50}
      MAX_PRODUCTS_PER_REQUEST: ${MAX_PRODUCTS_PER_REQUEST:-1000}
      MAX_PRODUCT_QUERIES_PER_REQUEST: ${MAX_PRODUCT_QUERIES_PER_REQUEST:-50}
      # Concurrent /graphql requests; 0 = DB pool size minus 2. Excess
      # requests wait INFLIGHT_WAIT_MS, then get 503 + Retry-After.
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      MAX_INFLIGHT_REQUESTS: ${MAX_INFLIGHT_REQUESTS:-0}
      # Public instance: no introspection. Set false in .env for local
      # GraphQL tooling.
      DISABLE_INTROSPECTION: ${DISABLE_INTROSPECTION:-true}
      # /metrics is served only on this listener, never on :4000. It is
      # loopback inside the container; read it with
      #   docker compose exec api wget -qO- http://127.0.0.1:9090/metrics
      # To scrape from the host, set METRICS_ADDR=:9090 and publish
      # "127.0.0.1:<port>:9090" (never a public interface).
      METRICS_ADDR: ${METRICS_ADDR:-127.0.0.1:9090}
      GOMEMLIMIT: ${API_GOMEMLIMIT:-900MiB}
      # Behind Cloudflare: trust the CF edge so rate limiting keys on the
      # real client IP (CF-Connecting-IP) rather than the shared edge IP.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "127.0.0.1:4000:4000"  # localhost only; Caddy reverse-proxies /graphql. Not publicly exposed.
    deploy:
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-1g}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
